<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Disc Strike Legends - Carrom Pool Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap');
        body { font-family: 'Poppins', sans-serif; background-color: #0b0f19; color: #ffffff; overflow: hidden; user-select: none; }
        .wood-board { background: radial-gradient(circle, #DEB887 0%, #CD853F 70%, #8B4513 100%); box-shadow: inset 0 0 50px rgba(0,0,0,0.6), 0 10px 30px rgba(0,0,0,0.8); }
        .pocket { background: #050505; box-shadow: inset 0 8px 15px rgba(0,0,0,0.9); }
        .glass-panel { background: rgba(17, 24, 39, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .glow-btn { box-shadow: 0 0 20px rgba(234, 179, 8, 0.4); transition: all 0.2s ease; }
        .glow-btn:active { transform: scale(0.95); }
    </style>
</head>
<body class="w-screen h-screen flex flex-col justify-between items-center select-none">

    <!-- TOP HUD -->
    <header class="w-full max-w-md p-4 flex justify-between items-center glass-panel rounded-b-2xl z-20">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-full bg-amber-500 flex items-center justify-center font-bold text-lg shadow-inner border-2 border-yellow-300">👑</div>
            <div>
                <h1 class="text-xs font-semibold text-gray-400">PLAYER</h1>
                <p id="playerName" class="text-sm font-bold text-white">Jawwad AI</p>
            </div>
        </div>
        <div class="flex space-x-3 bg-gray-900/80 px-4 py-1.5 rounded-full border border-gray-700">
            <div class="flex items-center space-x-1"><i class="fa-solid fa-coins text-yellow-400"></i><span id="coinCount" class="text-sm font-bold text-yellow-400">5,450</span></div>
            <div class="text-gray-600">|</div>
            <div class="flex items-center space-x-1"><i class="fa-solid fa-gem text-cyan-400"></i><span id="gemCount" class="text-sm font-bold text-cyan-400">120</span></div>
        </div>
    </header>

    <!-- MAIN SCREEN CONTAINER -->
    <main class="relative w-full max-w-md flex-1 flex flex-col justify-center items-center p-4">

        <!-- HOME / MENU VIEW -->
        <div id="homeView" class="absolute inset-0 z-10 flex flex-col justify-center items-center p-6 bg-[#0b0f19]">
            <div class="text-center mb-8">
                <h2 class="text-4xl font-extrabold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 via-amber-500 to-orange-500 drop-shadow-lg">DISC STRIKE</h2>
                <p class="text-xs tracking-widest text-gray-400 uppercase mt-1">Carrom Pool Legends</p>
            </div>

            <!-- Arena Card -->
            <div class="w-full glass-panel rounded-2xl p-5 mb-6 text-center border border-amber-500/30">
                <span class="bg-amber-500/20 text-amber-400 text-xs px-3 py-1 rounded-full font-semibold">Arena 1</span>
                <h3 class="text-xl font-bold mt-2 text-white">Delhi Board</h3>
                <p class="text-xs text-gray-400 mt-1">Entry Fee: <span class="text-yellow-400 font-bold">200 Coins</span></p>
            </div>

            <!-- Action Buttons -->
            <button onclick="startGame()" class="w-full py-4 bg-gradient-to-r from-amber-500 to-orange-600 rounded-xl font-bold text-lg text-white glow-btn mb-4 shadow-lg flex items-center justify-center space-x-2">
                <i class="fa-solid fa-play"></i><span>PLAY 1v1 MATCH</span>
            </button>
            <button onclick="openShop()" class="w-full py-3 bg-gray-800 hover:bg-gray-700 rounded-xl font-semibold text-sm text-gray-300 border border-gray-700 flex items-center justify-center space-x-2">
                <i class="fa-solid fa-store text-amber-400"></i><span>Strikers & Upgrades</span>
            </button>
        </div>

        <!-- GAMEPLAY VIEW -->
        <div id="gameView" class="hidden absolute inset-0 z-10 flex flex-col justify-center items-center bg-[#0b0f19]">
            <!-- Match Status -->
            <div class="w-full flex justify-between items-center mb-3 px-2">
                <div class="glass-panel px-3 py-1 rounded-lg text-xs font-bold text-cyan-400">You: <span id="playerScore">0</span></div>
                <div class="text-xs font-bold text-amber-400 uppercase tracking-widest" id="turnIndicator">Your Turn</div>
                <div class="glass-panel px-3 py-1 rounded-lg text-xs font-bold text-rose-400">AI: <span id="aiScore">0</span></div>
            </div>

            <!-- CARROM BOARD -->
            <div id="boardContainer" class="relative w-[340px] h-[340px] wood-board rounded-3xl border-8 border-[#5C4033] flex justify-center items-center shadow-2xl">
                <!-- Pockets -->
                <div class="absolute top-2 left-2 w-8 h-8 rounded-full pocket"></div>
                <div class="absolute top-2 right-2 w-8 h-8 rounded-full pocket"></div>
                <div class="absolute bottom-2 left-2 w-8 h-8 rounded-full pocket"></div>
                <div class="absolute bottom-2 right-2 w-8 h-8 rounded-full pocket"></div>

                <!-- Canvas for Physics & Discs -->
                <canvas id="gameCanvas" width="324" height="324" class="rounded-2xl cursor-pointer"></canvas>
            </div>

            <!-- Power Controller Slider -->
            <div class="w-full mt-4 glass-panel p-3 rounded-xl flex items-center space-x-3">
                <span class="text-xs font-bold text-gray-400">POWER</span>
                <input type="range" id="powerSlider" min="5" max="25" value="15" class="w-full accent-amber-500 cursor-pointer">
                <button onclick="executeShot()" class="px-5 py-2 bg-gradient-to-r from-amber-500 to-orange-600 rounded-lg text-xs font-bold text-white shadow-md">STRIKE</button>
            </div>
        </div>

        <!-- SHOP VIEW -->
        <div id="shopView" class="hidden absolute inset-0 z-10 flex flex-col p-6 bg-[#0b0f19] overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold text-white">Striker Shop</h3>
                <button onclick="closeShop()" class="text-gray-400 hover:text-white text-sm"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="space-y-4">
                <div class="glass-panel p-4 rounded-2xl flex items-center justify-between border border-amber-500/40">
                    <div>
                        <h4 class="font-bold text-sm text-white">Cosmic Striker</h4>
                        <p class="text-xs text-gray-400 mt-0.5">Force: 8 | Aim: 9</p>
                    </div>
                    <span class="text-xs bg-amber-500 text-black font-bold px-3 py-1 rounded-full">Equipped</span>
                </div>
                <div class="glass-panel p-4 rounded-2xl flex items-center justify-between">
                    <div>
                        <h4 class="font-bold text-sm text-white">Fire Dragon Pro</h4>
                        <p class="text-xs text-gray-400 mt-0.5">Force: 10 | Aim: 8</p>
                    </div>
                    <button class="text-xs bg-yellow-500 hover:bg-yellow-400 text-black font-bold px-3 py-1.5 rounded-full">500 <i class="fa-solid fa-coins"></i></button>
                </div>
            </div>
        </div>

    </main>

    <!-- BOTTOM FOOTER NAV -->
    <footer class="w-full max-w-md p-3 flex justify-around items-center glass-panel rounded-t-2xl z-20 text-gray-400">
        <button onclick="switchTab('home')" class="flex flex-col items-center text-amber-500"><i class="fa-solid fa-house text-lg"></i><span class="text-[10px] mt-1 font-semibold">Home</span></button>
        <button onclick="openShop()" class="flex flex-col items-center hover:text-white"><i class="fa-solid fa-store text-lg"></i><span class="text-[10px] mt-1 font-semibold">Shop</span></button>
        <button onclick="alert('Leaderboard coming soon!')" class="flex flex-col items-center hover:text-white"><i class="fa-solid fa-trophy text-lg"></i><span class="text-[10px] mt-1 font-semibold">Rankings</span></button>
    </footer>

    <script>
        function switchTab(tab) {
            document.getElementById('homeView').classList.remove('hidden');
            document.getElementById('gameView').classList.add('hidden');
            document.getElementById('shopView').classList.add('hidden');
        }
        function openShop() {
            document.getElementById('shopView').classList.remove('hidden');
        }
        function closeShop() {
            document.getElementById('shopView').classList.add('hidden');
        }
        function startGame() {
            document.getElementById('homeView').classList.add('hidden');
            document.getElementById('gameView').classList.remove('hidden');
            initCanvas();
        }

        // Simple Game Canvas & Physics Simulation
        let canvas, ctx, striker, discs = [];
        function initCanvas() {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');
            
            striker = { x: 162, y: 260, radius: 14, color: '#f59e0b', vx: 0, vy: 0 };
            discs = [
                { x: 162, y: 140, radius: 10, color: '#ffffff', active: true, vx: 0, vy: 0 }, // White puck
                { x: 142, y: 155, radius: 10, color: '#ef4444', active: true, vx: 0, vy: 0 }, // Red puck
                { x: 182, y: 155, radius: 10, color: '#ffffff', active: true, vx: 0, vy: 0 },
                { x: 162, y: 170, radius: 10, color: '#ef4444', active: true, vx: 0, vy: 0 }
            ];
            requestAnimationFrame(updateGame);
        }

        function executeShot() {
            let power = document.getElementById('powerSlider').value;
            striker.vy = -power * 0.5;
        }

        function updateGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Board Center Circle
            ctx.beginPath();
            ctx.arc(162, 162, 35, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(0,0,0,0.15)';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Update & Draw Striker
            striker.x += striker.vx;
            striker.y += striker.vy;
            striker.vx *= 0.96;
            striker.vy *= 0.96;

            // Wall collisions for striker
            if (striker.x < 20 || striker.x > canvas.width - 20) striker.vx *= -1;
            if (striker.y < 20 || striker.y > canvas.height - 20) striker.vy *= -1;

            ctx.beginPath();
            ctx.arc(striker.x, striker.y, striker.radius, 0, Math.PI * 2);
            ctx.fillStyle = striker.color;
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#b45309';
            ctx.stroke();

            // Update & Draw Discs
            discs.forEach(disc => {
                if (!disc.active) return;
                disc.x += disc.vx;
                disc.y += disc.vy;
                disc.vx *= 0.96;
                disc.vy *= 0.96;

                // Simple collision with striker
                let dx = disc.x - striker.x;
                let dy = disc.y - striker.y;
                let dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < disc.radius + striker.radius) {
                    disc.vx = striker.vx * 0.8;
                    disc.vy = striker.vy * 0.8;
                }

                ctx.beginPath();
                ctx.arc(disc.x, disc.y, disc.radius, 0, Math.PI * 2);
                ctx.fillStyle = disc.color;
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#000';
                ctx.stroke();
            });

            requestAnimationFrame(updateGame);
        }
    </script>
</body>
</html>
