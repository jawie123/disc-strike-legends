<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Disc Strike Legends - Pro Carrom</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap');
        body { font-family: 'Poppins', sans-serif; background-color: #060913; color: #ffffff; overflow: hidden; user-select: none; }
        .wood-board { background: radial-gradient(circle, #E3A857 0%, #C68B59 65%, #5C3A21 100%); box-shadow: inset 0 0 40px rgba(0,0,0,0.7), 0 10px 30px rgba(0,0,0,0.9); }
        .pocket { background: #020202; box-shadow: inset 0 10px 15px rgba(0,0,0,0.95); }
        .glass-panel { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.12); }
        .glow-btn { box-shadow: 0 0 25px rgba(245, 158, 11, 0.5); transition: all 0.15s ease; }
        .glow-btn:active { transform: scale(0.95); }
    </style>
</head>
<body class="w-screen h-screen flex flex-col justify-between items-center select-none">

    <!-- TOP HUD -->
    <header class="w-full max-w-md p-3 flex justify-between items-center glass-panel rounded-b-2xl z-20">
        <div class="flex items-center space-x-3">
            <div class="w-9 h-9 rounded-full bg-amber-500 flex items-center justify-center font-bold text-base shadow-inner border-2 border-yellow-300">👑</div>
            <div>
                <h1 class="text-[10px] font-semibold text-gray-400 tracking-wider">PLAYER</h1>
                <p class="text-xs font-bold text-white">Jawwad AI</p>
            </div>
        </div>
        <div class="flex space-x-3 bg-gray-900/90 px-3 py-1 rounded-full border border-gray-700 text-xs">
            <div class="flex items-center space-x-1"><i class="fa-solid fa-coins text-yellow-400"></i><span id="coinCount" class="font-bold text-yellow-400">5,450</span></div>
            <div class="text-gray-600">|</div>
            <div class="flex items-center space-x-1"><i class="fa-solid fa-gem text-cyan-400"></i><span id="gemCount" class="font-bold text-cyan-400">120</span></div>
        </div>
    </header>

    <!-- MAIN APP CONTAINER -->
    <main class="relative w-full max-w-md flex-1 flex flex-col justify-center items-center p-3">

        <!-- HOME MENU -->
        <div id="homeView" class="absolute inset-0 z-30 flex flex-col justify-center items-center p-6 bg-[#060913]">
            <div class="text-center mb-6">
                <h2 class="text-4xl font-extrabold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 via-amber-500 to-orange-500 drop-shadow-xl">DISC STRIKE</h2>
                <p class="text-[10px] tracking-widest text-gray-400 uppercase mt-1">Ultimate Carrom Pro Arena</p>
            </div>

            <div class="w-full glass-panel rounded-2xl p-4 mb-5 text-center border border-amber-500/40 shadow-xl">
                <span class="bg-amber-500/20 text-amber-400 text-[10px] px-3 py-1 rounded-full font-bold uppercase">Pro Championship</span>
                <h3 class="text-lg font-bold mt-2 text-white">Grand Royale Arena</h3>
                <p class="text-xs text-gray-400 mt-1">Prize Pool: <span class="text-yellow-400 font-bold">400 Coins</span></p>
            </div>

            <button onclick="startGame()" class="w-full py-4 bg-gradient-to-r from-amber-500 to-orange-600 rounded-xl font-bold text-base text-white glow-btn mb-3 flex items-center justify-center space-x-2">
                <i class="fa-solid fa-play"></i><span>PLAY 1v1 MATCH</span>
            </button>
            <button onclick="openShop()" class="w-full py-3 bg-gray-800/80 hover:bg-gray-700 rounded-xl font-semibold text-xs text-gray-300 border border-gray-700 flex items-center justify-center space-x-2">
                <i class="fa-solid fa-store text-amber-400"></i><span>Strikers & Equipment</span>
            </button>
        </div>

        <!-- GAMEPLAY ARENA -->
        <div id="gameView" class="hidden absolute inset-0 z-20 flex flex-col justify-between items-center py-2 bg-[#060913]">
            <!-- Match Status HUD -->
            <div class="w-full flex justify-between items-center px-3">
                <div class="glass-panel px-3 py-1 rounded-lg text-xs font-bold text-cyan-400">You: <span id="playerScore">0</span></div>
                <div class="text-xs font-bold text-amber-400 uppercase tracking-widest" id="turnIndicator">Drag Striker & Shoot</div>
                <div class="glass-panel px-3 py-1 rounded-lg text-xs font-bold text-rose-400">AI: <span id="aiScore">0</span></div>
            </div>

            <!-- CARROM BOARD CANVAS WRAPPER -->
            <div id="boardContainer" class="relative w-[340px] h-[340px] wood-board rounded-3xl border-8 border-[#4A2E18] flex justify-center items-center shadow-2xl overflow-hidden">
                <!-- 4 Corner Pockets -->
                <div class="absolute top-2 left-2 w-9 h-9 rounded-full pocket"></div>
                <div class="absolute top-2 right-2 w-9 h-9 rounded-full pocket"></div>
                <div class="absolute bottom-2 left-2 w-9 h-9 rounded-full pocket"></div>
                <div class="absolute bottom-2 right-2 w-9 h-9 rounded-full pocket"></div>

                <!-- Interactive Canvas -->
                <canvas id="gameCanvas" width="324" height="324" class="cursor-crosshair"></canvas>
            </div>

            <!-- In-game Controls -->
            <div class="w-full glass-panel p-3 rounded-xl flex justify-between items-center">
                <span class="text-[11px] text-gray-400 font-semibold">Pull back striker to release</span>
                <button onclick="resetMatch()" class="px-4 py-1.5 bg-rose-500/20 text-rose-400 border border-rose-500/40 rounded-lg text-xs font-bold">Restart</button>
            </div>
        </div>

        <!-- SHOP VIEW -->
        <div id="shopView" class="hidden absolute inset-0 z-30 flex flex-col p-5 bg-[#060913] overflow-y-auto">
            <div class="flex justify-between items-center mb-5">
                <h3 class="text-lg font-bold text-white">Pro Strikers</h3>
                <button onclick="closeShop()" class="text-gray-400 hover:text-white text-base"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="space-y-3">
                <div class="glass-panel p-3.5 rounded-2xl flex items-center justify-between border border-amber-500/40">
                    <div>
                        <h4 class="font-bold text-xs text-white">Golden Emperor</h4>
                        <p class="text-[10px] text-gray-400 mt-0.5">Force: 9 | Aim: 10</p>
                    </div>
                    <span class="text-[10px] bg-amber-500 text-black font-bold px-2.5 py-1 rounded-full">Equipped</span>
                </div>
            </div>
        </div>

    </main>

    <!-- FOOTER NAV -->
    <footer class="w-full max-w-md p-2 flex justify-around items-center glass-panel rounded-t-2xl z-20 text-gray-400">
        <button onclick="switchTab('home')" class="flex flex-col items-center text-amber-500"><i class="fa-solid fa-house text-base"></i><span class="text-[9px] mt-0.5 font-semibold">Home</span></button>
        <button onclick="openShop()" class="flex flex-col items-center hover:text-white"><i class="fa-solid fa-store text-base"></i><span class="text-[9px] mt-0.5 font-semibold">Shop</span></button>
        <button onclick="alert('Leaderboard Rank: #42 Global')" class="flex flex-col items-center hover:text-white"><i class="fa-solid fa-trophy text-base"></i><span class="text-[9px] mt-0.5 font-semibold">Rankings</span></button>
    </footer>

    <!-- STABLE GAME ENGINE SCRIPT -->
    <script>
        function switchTab(tab) {
            document.getElementById('homeView').classList.remove('hidden');
            document.getElementById('gameView').classList.add('hidden');
            document.getElementById('shopView').classList.add('hidden');
        }
        function openShop() { document.getElementById('shopView').classList.remove('hidden'); }
        function closeShop() { document.getElementById('shopView').classList.add('hidden'); }
        function startGame() {
            document.getElementById('homeView').classList.add('hidden');
            document.getElementById('gameView').classList.remove('hidden');
            initEngine();
        }

        let canvas, ctx, striker, discs = [], isDragging = false, dragStart = {x:0, y:0}, dragEnd = {x:0, y:0};
        let playerScore = 0, aiScore = 0, animationRunning = false;

        function initEngine() {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');

            resetMatchState();
            if (!animationRunning) {
                animationRunning = true;
                requestAnimationFrame(gameLoop);
            }
        }

        function resetMatchState() {
            striker = { x: 162, y: 260, radius: 14, color: '#f59e0b', vx: 0, vy: 0 };
            discs = [
                { x: 162, y: 140, radius: 10, color: '#ffffff', active: true, vx: 0, vy: 0 },
                { x: 142, y: 155, radius: 10, color: '#ef4444', active: true, vx: 0, vy: 0 },
                { x: 182, y: 155, radius: 10, color: '#ffffff', active: true, vx: 0, vy: 0 },
                { x: 162, y: 170, radius: 10, color: '#ef4444', active: true, vx: 0, vy: 0 }
            ];
        }

        function resetMatch() {
            playerScore = 0; aiScore = 0;
            document.getElementById('playerScore').innerText = playerScore;
            document.getElementById('aiScore').innerText = aiScore;
            resetMatchState();
        }

        // Mouse & Touch Interaction Setup
        canvas.onmousedown = (e) => handleStart(e.clientX, e.clientY);
        window.onmousemove = (e) => handleMove(e.clientX, e.clientY);
        window.onmouseup = () => handleEnd();

        canvas.ontouchstart = (e) => {
            if (e.touches.length > 0) handleStart(e.touches[0].clientX, e.touches[0].clientY);
        };
        window.ontouchmove = (e) => {
            if (e.touches.length > 0) handleMove(e.touches[0].clientX, e.touches[0].clientY);
        };
        window.ontouchend = () => handleEnd();

        function handleStart(clientX, clientY) {
            let rect = canvas.getBoundingClientRect();
            let x = clientX - rect.left;
            let y = clientY - rect.top;
            let dist = Math.hypot(x - striker.x, y - striker.y);

            if (dist < 35 && Math.abs(striker.vx) < 0.1 && Math.abs(striker.vy) < 0.1) {
                isDragging = true;
                dragStart = { x: striker.x, y: striker.y };
                dragEnd = { x: x, y: y };
            }
        }

        function handleMove(clientX, clientY) {
            if (!isDragging) return;
            let rect = canvas.getBoundingClientRect();
            dragEnd = { x: clientX - rect.left, y: clientY - rect.top };
        }

        function handleEnd() {
            if (!isDragging) return;
            isDragging = false;

            let dx = dragEnd.x - dragStart.x;
            let dy = dragEnd.y - dragStart.y;
            let power = Math.min(Math.hypot(dx, dy) * 0.15, 14);
            let angle = Math.atan2(dy, dx);

            if (power > 1) {
                striker.vx = Math.cos(angle) * power;
                striker.vy = Math.sin(angle) * power;
            }
        }

        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Center Board Circle
            ctx.beginPath();
            ctx.arc(162, 162, 35, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255,255,255,0.1)';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Physics: Striker
            striker.x += striker.vx;
            striker.y += striker.vy;
            striker.vx *= 0.98;
            striker.vy *= 0.98;

            let pad = 18;
            if (striker.x < pad || striker.x > canvas.width - pad) { striker.vx *= -1; striker.x = Math.max(pad, Math.min(canvas.width - pad, striker.x)); }
            if (striker.y < pad || striker.y > canvas.height - pad) { striker.vy *= -1; striker.y = Math.max(pad, Math.min(canvas.height - pad, striker.y)); }

            // Pockets
            let pockets = [{x: 22, y: 22}, {x: 302, y: 22}, {x: 22, y: 302}, {x: 302, y: 302}];
            pockets.forEach(p => {
                if (Math.hypot(striker.x - p.x, striker.y - p.y) < 18) {
                    striker.x = 162; striker.y = 260; striker.vx = 0; striker.vy = 0;
                }
            });

            // Physics: Discs
            discs.forEach((disc) => {
                if (!disc.active) return;
                disc.x += disc.vx;
                disc.y += disc.vy;
                disc.vx *= 0.98;
                disc.vy *= 0.98;

                if (disc.x < pad || disc.x > canvas.width - pad) { disc.vx *= -1; disc.x = Math.max(pad, Math.min(canvas.width - pad, disc.x)); }
                if (disc.y < pad || disc.y > canvas.height - pad) { disc.vy *= -1; disc.y = Math.max(pad, Math.min(canvas.height - pad, disc.y)); }

                pockets.forEach(p => {
                    if (Math.hypot(disc.x - p.x, disc.y - p.y) < 16) {
                        disc.active = false;
                        if (disc.color === '#ef4444') { playerScore++; document.getElementById('playerScore').innerText = playerScore; }
                        else { aiScore++; document.getElementById('aiScore').innerText = aiScore; }
                    }
                });

                // Striker vs Disc collision
                let ddx = disc.x - striker.x;
                let ddy = disc.y - striker.y;
                let dist = Math.hypot(ddx, ddy);
                if (dist < disc.radius + striker.radius) {
                    let overlap = (disc.radius + striker.radius) - dist;
                    let nx = ddx / dist;
                    let ny = ddy / dist;
                    disc.x += nx * overlap;
                    disc.y += ny * overlap;

                    let pnx = striker.vx - disc.vx;
                    let pny = striker.vy - disc.vy;
                    let pVal = pnx * nx + pny * ny;
                    if (pVal > 0) {
                        disc.vx += pVal * nx * 0.85;
                        disc.vy += pVal * ny * 0.85;
                        striker.vx -= pVal * nx * 0.85;
                        striker.vy -= pVal * ny * 0.85;
                    }
                }

                // Draw Disc
                ctx.beginPath();
                ctx.arc(disc.x, disc.y, disc.radius, 0, Math.PI * 2);
                ctx.fillStyle = disc.color;
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#111';
                ctx.stroke();
            });

            // Aiming Guide Line
            if (isDragging) {
                ctx.beginPath();
                ctx.moveTo(striker.x, striker.y);
                let aimX = striker.x + (dragStart.x - dragEnd.x) * 1.5;
                let aimY = striker.y + (dragStart.y - dragEnd.y) * 1.5;
                ctx.lineTo(aimX, aimY);
                ctx.strokeStyle = '#fbbf24';
                ctx.lineWidth = 3;
                ctx.setLineDash([4, 4]);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            // Draw Striker
            ctx.beginPath();
            ctx.arc(striker.x, striker.y, striker.radius, 0, Math.PI * 2);
            ctx.fillStyle = striker.color;
            ctx.fill();
            ctx.lineWidth = 2.5;
            ctx.strokeStyle = '#b45309';
            ctx.stroke();

            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
